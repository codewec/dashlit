[changelog]
header = """
# Changelog

All notable changes to DashLit are documented in this file.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/codewec/dashlit/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactors" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build", group = "<!-- 5 -->Build" },
  { message = "^infra", group = "<!-- 5 -->Infrastructure" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = "^style", group = "<!-- 8 -->Styles" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 9 -->Chores" },
  { message = "^wip", skip = true },
]
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/codewec/dashlit/issues/$1" },
]
