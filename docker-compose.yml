services:
  dashlit:
    image: ghcr.io/codewec/dashlit:${DASHLIT_TAG:-main}
    container_name: dashlit
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${DASHLIT_PORT:-3000}:8080'
    environment:
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET must be set}'
      INITIAL_ADMIN_USERNAME: '${INITIAL_ADMIN_USERNAME:-}'
      INITIAL_ADMIN_PASSWORD: '${INITIAL_ADMIN_PASSWORD:-}'
      OIDC_ISSUER: '${OIDC_ISSUER:-}'
      OIDC_CLIENT_ID: '${OIDC_CLIENT_ID:-}'
      OIDC_CLIENT_SECRET: '${OIDC_CLIENT_SECRET:-}'
      OIDC_REDIRECT_URL: '${OIDC_REDIRECT_URL:-}'
      OIDC_BUTTON_TITLE: '${OIDC_BUTTON_TITLE:-Sign in with OIDC}'
      OIDC_INSECURE_SKIP_TLS_VERIFY: '${OIDC_INSECURE_SKIP_TLS_VERIFY:-false}'
      DISABLE_PASSWORD_REGISTRATION: '${DISABLE_PASSWORD_REGISTRATION:-false}'
      DISABLE_OIDC_REGISTRATION: '${DISABLE_OIDC_REGISTRATION:-false}'
      DISABLE_OIDC_USER_MERGE: '${DISABLE_OIDC_USER_MERGE:-false}'
      DISABLE_PASSWORD_LOGIN: '${DISABLE_PASSWORD_LOGIN:-false}'
    volumes:
      - dashlit-data:/data

volumes:
  dashlit-data:
